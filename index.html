<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <!-- ===== LOGIN ===== -->
    <div id="loginBox">
        <div class="logo-area">
            <h1 class="logo-title">Associação Comunitária Itaqui Bacanga</h1>
            <p class="logo-subtitle">Sejam Bem-Vindos!</p>
        </div>

        <form class="login-form" onsubmit="enviarRecuperacao(event)">

            <div class="form-group">
                <label>E-mail</label>
                <input type="email" class="form-control">
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" class="form-control">
            </div>

            <button class="login-btn">Entrar</button>
        </form>

        <div class="forgot-password">
            <a onclick="mostrarCadastro()">Não tem conta? Cadastre-se</a>
        </div>

        <div class="forgot-password">
            <a onclick="mostrarRecuperacao()">Esqueceu sua senha?</a>
        </div>
    </div>

    <!-- ===== CADASTRO ===== -->
    <div id="cadastroBox" style="display:none;">

        <div class="logo-area">
            <p class="logo-subtitle">Cadastro de Usuário</p>
        </div>

        <div class="form-group">
            <label>Tipo de Cadastro</label>
            <select class="form-control" onchange="trocar(this.value)">
                <option value="pf">Pessoa Física</option>
                <option value="pj">Pessoa Jurídica</option>
            </select>
        </div>

        <!-- PF -->
        <form class="login-form" id="pf">
            <div class="form-group">
                <label>Nome Completo</label>
                <input class="form-control">
            </div>
            <div class="form-group">
                <label>CPF</label>
                <input class="form-control">
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input class="form-control">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" class="form-control">
            </div>
            <button class="login-btn">Cadastrar</button>
        </form>

        <!-- PJ -->
        <form class="login-form" id="pj" style="display:none;">
            <div class="form-group">
                <label>Nome da empresa</label>
                <input class="form-control">
            </div>
            <div class="form-group">
                <label>CNPJ</label>
                <input class="form-control">
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input class="form-control">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" class="form-control">
            </div>
            <button class="login-btn">Cadastrar</button>
        </form>

        <div class="forgot-password">
            <a onclick="voltarLogin()">← Voltar para o login</a>
        </div>

    </div>

    <!-- ===== RECUPERAÇÃO DE SENHA ===== -->
<div id="recuperarSenhaBox" style="display:none;">

    <div class="logo-area">
        <p class="logo-subtitle">Recuperar Senha</p>
    </div>

    <form class="login-form" onsubmit="enviarRecuperacao(event)">
        <div class="form-group">
            <label>E-mail cadastrado</label>
            <input type="email" id="emailRecuperacao" class="form-control" placeholder="seu.email@exemplo.com" required>
        </div>

        <button class="login-btn">Enviar link de recuperação</button>
    </form>

    <div class="forgot-password">
        <a onclick="voltarLogin()">← Voltar para o login</a>
    </div>

</div>


    <div class="project-info">
        <div class="footer-logos">
            <span>SOFTEX</span>
            <span>PERNAMBUCO</span>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
